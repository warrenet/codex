name: Profile Update Automation

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Optional branch name to create"
        required: false
      run_mode:
        description: "Set to 'run' to execute, leave as dry-run to require confirmation"
        required: false
        default: dry-run
      pr_title:
        description: "Pull request title"
        required: true
      pr_body:
        description: "Pull request body"
        required: true
      monitor_issue_url:
        description: "URL of the monitor issue (https://github.com/owner/repo/issues/N)"
        required: true

jobs:
  profile-update:
    runs-on: ubuntu-latest
    env:
      GIT_COMMITTER_NAME: ${{ github.actor }}
      GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
      GIT_AUTHOR_NAME: ${{ github.actor }}
      GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup git identity
        run: |
          git config user.name "${GIT_COMMITTER_NAME}"
          git config user.email "${GIT_COMMITTER_EMAIL}"

      - name: Determine branch name, run_mode and parse monitor issue URL
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            BR="${{ github.event.inputs.branch }}"
          else
            BR="profile-update-$(date -u +%Y%m%d%H%M%S)"
          fi
          RUN_MODE="${{ github.event.inputs.run_mode || 'dry-run' }}"
          PR_TITLE="${{ github.event.inputs.pr_title }}"
          PR_BODY="${{ github.event.inputs.pr_body }}"
          MONITOR="${{ github.event.inputs.monitor_issue_url }}"

          if [[ "$MONITOR" =~ https://github.com/([^/]+)/([^/]+)/issues/([0-9]+) ]]; then
            MI_OWNER="${BASH_REMATCH[1]}"
            MI_REPO="${BASH_REMATCH[2]}"
            MI_ISSUE="${BASH_REMATCH[3]}"
          else
            echo "ERROR: monitor_issue_url not in expected format: $MONITOR" >&2
            exit 1
          fi

          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          echo "run_mode=$RUN_MODE" >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo "pr_body=$PR_BODY" >> "$GITHUB_OUTPUT"
          echo "monitor_owner=$MI_OWNER" >> "$GITHUB_OUTPUT"
          echo "monitor_repo=$MI_REPO" >> "$GITHUB_OUTPUT"
          echo "monitor_issue=$MI_ISSUE" >> "$GITHUB_OUTPUT"

      - name: Build dry-run plan (JSON)
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          BR="${{ steps.prepare.outputs.branch }}"
          PR_TITLE="${{ steps.prepare.outputs.pr_title }}"
          PR_BODY="${{ steps.prepare.outputs.pr_body }}"

          COMMIT_MSG="chore(readme): enhance README and add project hygiene files"

          FILES=(
            "README.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "LICENSE"
            ".github/CODEOWNERS"
            ".github/dependabot.yml"
            "assets/demo/demo1.svg"
            "assets/demo/demo2.svg"
            ".pre-commit-config.yaml"
            "docs/index.md"
            "FUNDING.yml"
            ".github/workflows/ci.yml"
            ".github/workflows/lint-and-test.yml"
            ".github/workflows/codeql-analysis.yml"
            ".github/workflows/readme-update.yml"
            ".github/workflows/auto-merge.yml"
            ".github/workflows/pre-commit.yml"
            ".github/workflows/stale.yml"
            ".github/release-drafter.yml"
          )

          PLAN=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "$BR" \
            --arg commit_msg "$COMMIT_MSG" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_body "$PR_BODY" \
            --argjson files "$(printf '%s\n' "${FILES[@]}" | jq -R -s -c 'split("\n")[:-1]')" \
            '{repo:$repo, branch:$branch, commit_message:$commit_msg, pr_title:$pr_title, pr_body:$pr_body, files:$files}')
          echo "$PLAN" > dry_run_plan.json
          echo "plan_path=$(pwd)/dry_run_plan.json" >> "$GITHUB_OUTPUT"
          echo "::notice::Dry-run plan written to dry_run_plan.json"

      - name: Post dry-run plan as comment on monitor issue
        id: post_plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MI_OWNER="${{ steps.prepare.outputs.monitor_owner }}"
          MI_REPO="${{ steps.prepare.outputs.monitor_repo }}"
          MI_ISSUE="${{ steps.prepare.outputs.monitor_issue }}"
          PLAN_JSON=$(cat dry_run_plan.json)
          BODY="## Automation dry-run plan (generated by workflow run ${GITHUB_RUN_ID})\n\n\`\`\`json\n${PLAN_JSON}\n\`\`\`\n\nIf you want this workflow to proceed, add a comment with exactly: CONFIRM RUN\n\nRun summary:\n- Repo: ${{ github.repository }}\n- Branch to create: ${{ steps.prepare.outputs.branch }}\n- PR title: ${{ steps.prepare.outputs.pr_title }}\n\n(Automation will wait for CONFIRM RUN on this issue before proceeding.)"
          API="https://api.github.com/repos/${MI_OWNER}/${MI_REPO}/issues/${MI_ISSUE}/comments"
          RESP=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -d "$(jq -nc --arg body "$BODY" '{body:$body}')" "$API")
          COMMENT_URL=$(echo "$RESP" | jq -r .html_url // empty)
          if [ -z "$COMMENT_URL" ] || [ "$COMMENT_URL" = "null" ]; then
            echo "Failed to post plan comment. Response:" >&2
            echo "$RESP" >&2
            exit 1
          fi
          echo "plan_comment_url=$COMMENT_URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Dry-run plan posted: $COMMENT_URL"

      - name: Wait for CONFIRM RUN (if run_mode==dry-run)
        if: ${{ steps.prepare.outputs.run_mode == 'dry-run' }}
        id: wait_confirm
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MI_OWNER="${{ steps.prepare.outputs.monitor_owner }}"
          MI_REPO="${{ steps.prepare.outputs.monitor_repo }}"
          MI_ISSUE="${{ steps.prepare.outputs.monitor_issue }}"
          echo "Waiting for a comment containing exact phrase: CONFIRM RUN on issue ${MI_OWNER}/${MI_REPO}#${MI_ISSUE}"
          MAX_ATTEMPTS=60
          SLEEP_SEC=30
          FOUND=0
          for i in $(seq 1 $MAX_ATTEMPTS); do
            COMMENTS=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${MI_OWNER}/${MI_REPO}/issues/${MI_ISSUE}/comments")
            if echo "$COMMENTS" | jq -r '.[].body' | grep -qx "CONFIRM RUN"; then
              FOUND=1
              echo "CONFIRM RUN found in comments."
              break
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: CONFIRM RUN not found; sleeping ${SLEEP_SEC}s..."
            sleep $SLEEP_SEC
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No CONFIRM RUN received within timeout. Exiting without making changes."
            exit 78
          fi
          echo "::notice::Proceeding after CONFIRM RUN."

      - name: Create files and commit (branch-and-pr)
        if: ${{ steps.prepare.outputs.run_mode != 'dry-run' || (steps.prepare.outputs.run_mode == 'dry-run' && steps.wait_confirm.outcome == 'success') }}
        id: make_changes
        shell: bash
        env:
          GIT_AUTHOR_NAME: "${GIT_COMMITTER_NAME}"
          GIT_AUTHOR_EMAIL: "${GIT_COMMITTER_EMAIL}"
        run: |
          set -euo pipefail
          BR="${{ steps.prepare.outputs.branch }}"
          git checkout -b "$BR"

          cat > README.md <<'README_EOF'
<div align="center">
  <img src="assets/warren-banner-gradient.png" alt="Warren Edward Trepp — banner" width="100%">
</div>

# Warren Edward Trepp
**AI Systems Architect & Strategic Automation Designer** (he/him)

Architecting intelligent systems that merge human identity, AI precision, and tactical execution.

Last updated: <!--LAST_UPDATED-->
README_EOF

          cat > CONTRIBUTING.md <<'CONTRIB_EOF'
# Contributing

Thank you for your interest in contributing!

Steps:
1. Fork the repository.
2. Create a branch: git checkout -b feature/your-feature
3. Run tests and linters locally.
4. Open a pull request with tests and description.
CONTRIB_EOF

          cat > CODE_OF_CONDUCT.md <<'COC_EOF'
# Contributor Covenant Code of Conduct (v2.0)

Be kind and respectful. Report violations to warrenet@protonmail.com.
COC_EOF

          cat > SECURITY.md <<'SEC_EOF'
# Security

To report a security vulnerability, email: warrenet@protonmail.com
Do not open a public issue for security reports.
SEC_EOF

          cat > LICENSE <<'LIC_EOF'
MIT License

Copyright (c) 2025 warrenet

Permission is hereby granted, free of charge...
LIC_EOF

          mkdir -p .github
          cat > .github/CODEOWNERS <<'CODEOWNERS_EOF'
* @warrenet
CODEOWNERS_EOF

          cat > .github/dependabot.yml <<'DEPENDABOT_EOF'
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
DEPENDABOT_EOF

          mkdir -p assets/demo
          cat > assets/demo/demo1.svg <<'SVG1'
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180">
  <rect width="100%" height="100%" fill="#0f1722"/>
  <text x="28" y="46" font-family="monospace" font-size="20" fill="#8ee6a0">$ termux-setup — demo</text>
</svg>
SVG1

          cat > assets/demo/demo2.svg <<'SVG2'
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180">
  <rect width="100%" height="100%" fill="#081424"/>
  <text x="28" y="46" font-family="monospace" font-size="20" fill="#7dd3fc">termux — script runner</text>
</svg>
SVG2

          cat > .pre-commit-config.yaml <<'PC_EOF'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
PC_EOF

          mkdir -p docs
          cat > docs/index.md <<'DOCS_EOF'
# Documentation
Welcome — place documentation here.
DOCS_EOF

          cat > FUNDING.yml <<'FUND_EOF'
github: ["warrenet"]
FUND_EOF

          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'CI_EOF'
name: CI (Node & Python)
on:
  pull_request:
    branches: [ main ]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install
        run: npm ci || true
      - name: Run tests
        run: npm test || true
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Run tests
        run: pytest -q || true
CI_EOF

          cat > .github/workflows/lint-and-test.yml <<'LINT_EOF'
name: Lint & Test
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install & Lint
        run: |
          npm ci || true
          npm run lint || true
      - name: Setup Python & Test
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - run: |
          pip install -r requirements.txt || true
          pytest -q || true
LINT_EOF

          cat > .github/workflows/codeql-analysis.yml <<'CODEQL_EOF'
name: "CodeQL"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3
CODEQL_EOF

          cat > .github/workflows/readme-update.yml <<'README_WF_EOF'
name: README Auto Update
on:
  schedule:
    - cron: '0 12 * * 1'
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update timestamp
        run: |
          perl -0pi -e 's/Last updated: <!--LAST_UPDATED-->\n/Last updated: <!--LAST_UPDATED-->\n/' README.md
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated README refresh"
README_WF_EOF

          cat > .github/workflows/auto-merge.yml <<'AUTO_MERGE_EOF'
name: Auto Merge
on:
  pull_request:
    types: [labeled]
jobs:
  automerge:
    if: contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            })
AUTO_MERGE_EOF

          cat > .github/workflows/pre-commit.yml <<'PRECOMMIT_EOF'
name: pre-commit
on:
  pull_request:
    branches: [ main ]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - uses: pre-commit/action@v3.0.1
PRECOMMIT_EOF

          cat > .github/workflows/stale.yml <<'STALE_EOF'
name: Mark stale issues
on:
  schedule:
    - cron: '0 0 * * *'
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: 'This issue has been automatically marked as stale.'
          close-issue-message: 'Closing this issue due to prolonged inactivity.'
STALE_EOF

          cat > .github/release-drafter.yml <<'DRAFTER_EOF'
template: |
  ## What's Changed

  $CHANGES

name-template: 'v$RESOLVED_VERSION'
DRAFTER_EOF

          git add README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md LICENSE \
            .github/CODEOWNERS .github/dependabot.yml assets/demo/demo1.svg assets/demo/demo2.svg \
            .pre-commit-config.yaml docs/index.md FUNDING.yml \
            .github/workflows/ci.yml .github/workflows/lint-and-test.yml \
            .github/workflows/codeql-analysis.yml .github/workflows/readme-update.yml \
            .github/workflows/auto-merge.yml .github/workflows/pre-commit.yml \
            .github/workflows/stale.yml .github/release-drafter.yml

          git commit -m "chore(readme): enhance README and add project hygiene files"

      - name: Push branch
        if: steps.make_changes.outcome == 'success'
        run: |
          git push origin "${{ steps.prepare.outputs.branch }}"

      - name: Create pull request
        if: steps.make_changes.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "${{ steps.prepare.outputs.pr_title }}" \
            --body "${{ steps.prepare.outputs.pr_body }}" \
            --base main \
            --head "${{ steps.prepare.outputs.branch }}" || \
          echo "PR creation skipped (possibly already exists)."
